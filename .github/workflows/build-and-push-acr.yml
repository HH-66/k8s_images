name: Build and push Kubespray offline bundle

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: base
        type: choice
        options:
          - base
          - nfd
          - gpu-operator
          - scheduler-plugins
          - kueue
          - kuberay
      release_tag:
        description: Immutable ACR tag
        required: true
        type: string
  push:
    tags:
      - bundle-v2.31.0-r*
      - addon-nfd-v0.19.0-r*
      - addon-gpu-operator-v26.3.3-r*
      - addon-scheduler-plugins-v0.35.4-devel-r*
      - addon-kueue-v0.19.0-r*
      - addon-kuberay-v1.6.2-r*

permissions:
  contents: read

concurrency:
  group: kubespray-offline-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ACR_IMAGE: registry.cn-shenzhen.aliyuncs.com/liuhh/k8s-images
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out builder repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate release contract
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ ^bundle-v2\.31\.0-r[1-9][0-9]*$ ]]; then
            artifact=base
          elif [[ "${RELEASE_TAG}" =~ ^addon-nfd-v0\.19\.0-r[1-9][0-9]*$ ]]; then
            artifact=nfd
          elif [[ "${RELEASE_TAG}" =~ ^addon-gpu-operator-v26\.3\.3-r[1-9][0-9]*$ ]]; then
            artifact=gpu-operator
          elif [[ "${RELEASE_TAG}" =~ ^addon-scheduler-plugins-v0\.35\.4-devel-r[1-9][0-9]*$ ]]; then
            artifact=scheduler-plugins
          elif [[ "${RELEASE_TAG}" =~ ^addon-kueue-v0\.19\.0-r[1-9][0-9]*$ ]]; then
            artifact=kueue
          elif [[ "${RELEASE_TAG}" =~ ^addon-kuberay-v1\.6\.2-r[1-9][0-9]*$ ]]; then
            artifact=kuberay
          else
            echo "unsupported release tag: ${RELEASE_TAG}" >&2
            exit 2
          fi
          requested_artifact='${{ inputs.artifact }}'
          if test -n "${requested_artifact}"; then
            test "${requested_artifact}" = "${artifact}"
          fi
          printf 'artifact=%s\n' "${artifact}" >> "${GITHUB_ENV}"
          python3 scripts/validate-acr-repository.py "${ACR_IMAGE}"
          test -n "${ACR_USERNAME}"
          test -n "${ACR_PASSWORD}"

      - name: Install bundle build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils podman python3-venv skopeo zstd
          docker buildx version

      - name: Build and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${artifact}" in
            base) ./scripts/build-bundle.sh ;;
            nfd) ./addons/nfd/scripts/build-bundle.sh ;;
            gpu-operator) ./addons/gpu-operator/scripts/build-bundle.sh ;;
            scheduler-plugins) ./addons/scheduler-plugins/scripts/build-bundle.sh ;;
            kueue) ./addons/kueue/scripts/build-bundle.sh ;;
            kuberay) ./addons/kuberay/scripts/build-bundle.sh ;;
          esac

      - name: Assert the bundle did not grow beyond the pilot transport budget
        shell: bash
        run: |
          set -euo pipefail
          case "${artifact}" in
            base) archive=dist/kubespray-offline-base.tar.zst ;;
            nfd) archive=dist/nfd/jasper-k8s-nfd-offline.tar.zst ;;
            gpu-operator) archive=dist/gpu-operator/jasper-k8s-gpu-operator-offline.tar.zst ;;
            scheduler-plugins) archive=dist/scheduler-plugins/jasper-k8s-scheduler-plugins-offline.tar.zst ;;
            kueue) archive=dist/kueue/jasper-k8s-kueue-offline.tar.zst ;;
            kuberay) archive=dist/kuberay/jasper-k8s-kuberay-offline.tar.zst ;;
          esac
          test "$(stat -c %s "${archive}")" -le 107374182400

      - name: Build artifact image
        shell: bash
        run: |
          set -euo pipefail
          case "${artifact}" in
            base)
              context=dist
              dockerfile="${GITHUB_WORKSPACE}/Dockerfile"
              ;;
            nfd)
              context=dist/nfd
              dockerfile="${GITHUB_WORKSPACE}/addons/nfd/Dockerfile"
              ;;
            gpu-operator)
              context=dist/gpu-operator
              dockerfile="${GITHUB_WORKSPACE}/addons/gpu-operator/Dockerfile"
              ;;
            scheduler-plugins)
              context=dist/scheduler-plugins
              dockerfile="${GITHUB_WORKSPACE}/addons/scheduler-plugins/Dockerfile"
              ;;
            kueue)
              context=dist/kueue
              dockerfile="${GITHUB_WORKSPACE}/addons/kueue/Dockerfile"
              ;;
            kuberay)
              context=dist/kuberay
              dockerfile="${GITHUB_WORKSPACE}/addons/kuberay/Dockerfile"
              ;;
          esac
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --tag "${ACR_IMAGE}:${RELEASE_TAG}" \
            --file "${dockerfile}" \
            "${context}"

      - name: Log in and push to ACR
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          registry=${ACR_IMAGE%%/*}
          printf '%s' "${ACR_PASSWORD}" \
            | docker login "${registry}" --username "${ACR_USERNAME}" --password-stdin
          docker push "${ACR_IMAGE}:${RELEASE_TAG}"
          docker logout "${registry}"

      - name: Record pushed manifest digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(docker buildx imagetools inspect "${ACR_IMAGE}:${RELEASE_TAG}")
          digest=$(sed -n 's/^[[:space:]]*Digest:[[:space:]]*//p' <<< "${metadata}")
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(grep -c '^[[:space:]]*Digest:' <<< "${metadata}")" -eq 1
          immutable_ref="${ACR_IMAGE}@${digest}"
          printf 'image=%s\n' "${immutable_ref}" >> "${GITHUB_OUTPUT}"
          printf '### Immutable bundle image\n\n`%s`\n' "${immutable_ref}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jasper-k8s-offline-metadata-${{ env.RELEASE_TAG }}
          path: |
            dist/**/SHA256SUMS
            dist/**/provenance.json
            dist/**/source-images.lock
          if-no-files-found: error
          retention-days: 30
